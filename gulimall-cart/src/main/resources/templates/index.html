<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title></title>
    <script type="text/javascript" src="cart/js/jquery-3.1.1.min.js"></script>
    <script type="text/javascript" src="cart/bootstrap/js/bootstrap.js"></script>
    <script type="text/javascript" src="cart/js/swiper.min.js"></script>
    <script src="cart/js/swiper.min.js"></script>
    <link rel="stylesheet" type="text/css" href="cart/css/swiper.min.css"/>
    <link rel="stylesheet" type="text/css" href="cart/bootstrap/css/bootstrap.css"/>
    <link rel="stylesheet" type="text/css" href="cart/css/success.css"/>

</head>

<body>
<!--头部-->
<div class="alert-info">
    <div class="hd_wrap_top">
        <ul class="hd_wrap_left">
            <li class="hd_home"><i class="glyphicon glyphicon-home"></i>
                <a th:href="${shopHomeUrl}">谷粒商城首页</a>
            </li>

        </ul>

        <ul class="hd_wrap_right">

            <!-- 未登录：请登录 + 免费注册 -->
            <li th:if="${loginUser == null}">
                <a th:href="|${authUrl}/login.html|" class="link_login">你好，请登录</a>
            </li>
            <li th:if="${loginUser == null}">
                <a th:href="|${authUrl}/reg.html|" class="link_regist">免费注册</a>
            </li>
            <!-- 已登录：昵称 + 退出（登录态来自 session，Spring Session 落 Redis） -->
            <li th:if="${loginUser != null}">
                <a style="color: #2e6da4" href="#">你好，<span th:text="${loginUser.nickname != null ? loginUser.nickname : loginUser.username}">会员</span></a>
            </li>
            <li th:if="${loginUser != null}">
                <a th:href="|${authUrl}/logout.html|" class="link_regist">退出登录</a>
            </li>

            <li class="spacer"></li>

            <li>
                <a th:href="|${orderUrl}/list.html|">我的订单</a>
            </li>

        </ul>

    </div>
</div>

<div class="nav-tabs-justified">
    <div class="nav_wrap">

        <div class="nav_top">
            <div class="nav_top_one">
                <a th:href="${shopHomeUrl}"><img src="cart/img/logo1.jpg" style="height: 60px;width:180px;"/></a>
            </div>
            <div class="nav_top_two"><input type="text"/>
                <button>搜索</button>
            </div>


        </div>

    </div>
</div>

<div class="main">

    <div class="success-wrap">
        <div class="w" id="result">
            <div class="m succeed-box">
                <div th:if="${item!=null}" class="mc success-cont">
                    <div class="success-lcol">
                        <div class="success-top"><b class="succ-icon"></b>
                            <h3 class="ftx-02">商品已成功加入购物车</h3></div>
                        <div class="p-item">
                            <div class="p-img">
                                <a href="/javascript:;" target="_blank">
                                    <img style="height:60px;width:60px;" th:src="${item.image}">
                                </a>
                            </div>
                            <div class="p-info">
                                <div class="p-name">
                                    <a th:href="|${shopHomeUrl}/item.html?skuId=${item.skuId}|"
                                        th:text="${item.title}"></a>
                                </div>
                                <div class="p-extra"><span class="txt" th:text="'数量：' + ${item.count}"></span></div>
                            </div>
                            <div class="clr"></div>
                        </div>
                    </div>
                    <div class="success-btns success-btns-new">
                        <div class="success-ad">
                            <a href="/#none"></a>
                        </div>
                        <div class="clr"></div>
                        <div class="bg_shop">
                            <a class="btn-tobback"
                               th:href="|${shopHomeUrl}/item.html?skuId=${item.skuId}|">查看商品详情</a>
                            <a class="btn-addtocart" th:href="|${cartUrl}/cart.html|"
                               id="GotoShoppingCart"><b></b>去购物车结算</a>
                        </div>
                    </div>
                </div>
                <div th:if="${item==null}" class="mc success-cont">
                    <h2 style="color: red">购物车中无商品</h2>
                    <a th:href="${shopHomeUrl}">去购物</a>
                </div>
            </div>
        </div>
    </div>

</div>
    <!-- 谷粒商城 AI 助手：悬浮宠物 + 聊天窗 -->
    <script src="/gulimall/agent/widget/chat-widget.js" defer></script>
</body>
<script type="text/javascript" src="cart/js/success.js"></script>

</html>
