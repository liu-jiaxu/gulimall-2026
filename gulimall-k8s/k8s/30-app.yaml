apiVersion: v1
kind: Service
metadata:
  name: gulimall-k8s
  namespace: gulimall-k8s
  labels:
    app: gulimall-k8s
spec:
  type: NodePort
  selector:
    app: gulimall-k8s
  ports:
    - name: http
      port: 18080
      targetPort: 18080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gulimall-k8s
  namespace: gulimall-k8s
  labels:
    app: gulimall-k8s
spec:
  replicas: 1
  # 应用使用内存 HttpSession，单副本 + Recreate，避免滚动更新时新旧 Pod 同时接收请求导致登录态丢失
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gulimall-k8s
  template:
    metadata:
      labels:
        app: gulimall-k8s
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: liujiaxucn/gulimall-k8s:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 18080
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: gulimall_k8s_ai
            - name: MYSQL_USERNAME
              value: root
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gulimall-k8s-secrets
                  key: mysql-password
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gulimall-k8s-secrets
                  key: redis-password
            - name: INVITE_CODE
              valueFrom:
                secretKeyRef:
                  name: gulimall-k8s-secrets
                  key: invite-code
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gulimall-k8s-secrets
                  key: ai-api-key
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=96m -Xss512k -Duser.timezone=Asia/Shanghai -Dfile.encoding=UTF-8"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 40
      volumes:
        - name: tmp
          emptyDir: {}
