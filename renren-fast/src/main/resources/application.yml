# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
    connection-timeout: 5000ms
  port: 8080
  servlet:
    context-path: /renren-fast

spring:
  application:
    name: renren-fast

  # 环境 dev|test|prod
  profiles:
    active: dev
  # jackson时间格式化
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

  mvc:
    throw-exception-if-no-handler-found: true
  config:
    import:
      - optional:file:./config/${spring.application.name}.yaml
      - optional:file:../config/${spring.application.name}.yaml
#  resources:
#    add-mappings: false


#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: io.renren.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: AUTO
      logic-delete-value: -1
      logic-not-delete-value: 0
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'


renren:
  redis:
    open: false
  shiro:
    redis: false
  # APP模块，是通过jwt认证的，如果要使用APP模块，则需要修改【加密秘钥】
  jwt:
    # 加密秘钥
    secret: <your-jwt-secret>
    # token有效时长，7天，单位秒
    expire: 604800
    header: token

# agent 专用 JWT：管理端签发（与 renren-fast 自身的 APP JWT 完全分开）
gulimall:
  agent:
    jwt:
      issuer: renren-fast
      audience: gulimall-agent
      cookie-name: AGENT_JWT_ADMIN
      cookie-domain: admin.gulimall.vip
      cookie-path: /gulimall/agent/
      cookie-secure: ${AGENT_JWT_COOKIE_SECURE:false}
      ttl: 30m
      key-id: admin-2026-01
      private-key-path: ${AGENT_JWT_ADMIN_PRIVATE_KEY_PATH:jwt/admin/jwt_private.pem}