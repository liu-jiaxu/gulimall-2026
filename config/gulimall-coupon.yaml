# ============================================================
# gulimall-coupon 模块私有配置（优惠券 / gulimall_sms 库）
# 共用部分见同目录 common.yaml
# ============================================================

# Nacos 配置中心的命名空间与分组（这两个是 ID，属于半敏感信息）
NACOS_NAMESPACE: cb7e3766-18df-46b7-a6a1-c9cba6c6189a
NACOS_GROUP: COUPON_GROUP

# 补充
# 由于后期配置文件会配置很多内容，因此可以将配置文件拆分成多个配置文件放到Nacos上读取
# 例如端口号、DB配置、框架配置、微服务配置、日志配置、权限配置等多个配置文件
# 然后微服务启动后加载多个配置文件即可 spring.config.import=optional:nacos:gulimall.yaml

# common中自定义鉴权配置
#gulimall:
#  shiro:
#    enabled: true          # 开启拦截
#    permissions: coupon:coupon:list,coupon:coupon:info   # 当前用户权限（逗号分隔）
#    permission-all: true   # 开发期放行所有权限（可选）

server:
  port: 7000

spring:
  datasource:
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    # 参数	                                    作用
    # useUnicode=true&characterEncoding=UTF-8	防止中文乱码
    # serverTimezone=Asia/Shanghai	            必须设置，否则报时区错误
    # allowPublicKeyRetrieval=true	            必须设置，否则报公钥检索错误
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/gulimall_sms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # mysql8.0
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis：关联秒杀商品成功后要把秒杀库存写进去
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  # Nacos配置
  cloud:
    nacos:
      # 配置管理
      config:
        # 指定配置管理命名空间（Nacos控制台 -> 配置管理 -> 命名空间），默认是public
        # 注意：Nacos命名空间必须是ID，不要引入名称！
        namespace: ${NACOS_NAMESPACE}
        # 指定配置管理配置组（Nacos控制台 -> 配置管理 -> 配置列表），默认是DEFAULT_GROUP
        # 注意大小写！
        group: ${NACOS_GROUP}

# 用于获取配置信息测试
user:
  # user.name 是 JVM 的系统属性（System.getProperty("user.name") = 当前操作系统用户名 = zgh29）。
  # Spring 的 Environment 中，系统属性优先级高于配置文件，所以 ${user.name} 解析到的是 JVM 的 zgh29，而不是 application.yaml 里配的 nacos。
  # 这是经典坑：user.name / user.home / user.dir 都是 JVM 保留属性，永远不要用它们做业务配置键。
  name: nacos
  password: 123456

# RabbitMQ 反序列化白名单：秒杀结束/结算消息体所在的包
gulimall:
  rabbitmq:
    trusted-packages: com.atguigu.gulimall.coupon.mq.message

# ---------- 调用链：Micrometer Tracing + OTLP（Jaeger） ----------
management:
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
