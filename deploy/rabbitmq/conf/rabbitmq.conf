# RabbitMQ 附加配置：挂到容器的 /etc/rabbitmq/conf.d/ 下自动生效（挂的是单个文件，不是整个目录）
# 改完要 docker compose up -d rabbitmq 重建容器（restart 不重读配置）

# ---------- 磁盘水位 ----------
# 默认要求「剩余磁盘 >= 机器内存」：于是启动日志里一直刷 disk_almost_full 告警 —— 一旦触发，RabbitMQ 会【阻塞生产者】，
# 消息根本发不进去。这里改成绝对值 4GB（比"跟着内存走"更符合这台混合部署的机器）。
disk_free_limit.absolute = 4GB
