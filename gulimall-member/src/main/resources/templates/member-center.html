<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>个人中心 - 谷粒商城</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft YaHei", Arial, sans-serif; background: #f5f5f5; color: #333; }
        header { background: #e1251b; color: #fff; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
        header .brand { font-size: 22px; font-weight: 600; color: #fff; text-decoration: none; }
        header .nav { display: flex; gap: 20px; font-size: 14px; }
        header .nav a { color: #fff; text-decoration: none; }
        header .nav a:hover { text-decoration: underline; }
        main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
        .hint { background: #fff3f3; border: 1px solid #ffd0d0; color: #e1251b; padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; }
        .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 18px; }
        .card h2 { margin: 0 0 16px; font-size: 18px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px 18px; }
        label { display: block; font-size: 14px; color: #666; }
        input, select, textarea { width: 100%; padding: 9px 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        textarea { min-height: 70px; resize: vertical; }
        button { padding: 9px 18px; border: 0; border-radius: 4px; background: #e1251b; color: #fff; font-size: 14px; cursor: pointer; }
        button.plain { background: #f2f2f2; color: #333; }
        button.small { padding: 5px 10px; font-size: 12px; }
        button.danger { background: #fff; color: #e1251b; border: 1px solid #e1251b; }
        .actions { margin-top: 16px; display: flex; gap: 10px; }
        .addr-list { display: grid; gap: 12px; }
        .addr-card { border: 1px solid #eee; border-radius: 6px; padding: 12px 14px; }
        .addr-card .line1 { font-weight: 600; margin-bottom: 6px; }
        .addr-card .detail { color: #666; font-size: 14px; }
        .addr-card .addr-actions { margin-top: 8px; display: flex; gap: 8px; }
        .default-tag { background: #e1251b; color: #fff; font-size: 12px; padding: 1px 6px; border-radius: 3px; margin-left: 8px; }
        .muted { color: #999; font-size: 13px; }
        #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(0,0,0,.78); color: #fff; padding: 10px 18px; border-radius: 4px; display: none; z-index: 99; }
        .full { grid-column: 1 / -1; }
    </style>
</head>
<body>
<header>
    <a class="brand" th:href="${shopHomeUrl}">谷粒商城 · 个人中心</a>
    <div class="nav">
        <a th:href="${shopHomeUrl}">返回首页</a>
        <a th:href="|${authUrl}/logout.html|">退出登录</a>
    </div>
</header>

<main>
    <div class="hint" th:if="${needAddress}">
        你还没有默认收货地址，请先在下面添加地址并勾选“设为默认”，否则秒杀下单会无法继续。
    </div>

    <!-- 基本资料 -->
    <div class="card">
        <h2>基本资料</h2>
        <div class="grid">
            <label>用户名
                <input type="text" th:value="${member.username}" disabled>
            </label>
            <label>昵称
                <input type="text" id="nickname" th:value="${member.nickname}">
            </label>
            <label>手机号
                <input type="text" id="mobile" th:value="${member.mobile}">
            </label>
            <label>邮箱
                <input type="text" id="email" th:value="${member.email}">
            </label>
            <label>头像 URL
                <input type="text" id="header" th:value="${member.header}">
            </label>
            <label>性别
                <select id="gender">
                    <option value="0" th:selected="${member.gender == null || member.gender == 0}">未知</option>
                    <option value="1" th:selected="${member.gender == 1}">男</option>
                    <option value="2" th:selected="${member.gender == 2}">女</option>
                </select>
            </label>
            <label>城市
                <input type="text" id="city" th:value="${member.city}">
            </label>
            <label>职业
                <input type="text" id="job" th:value="${member.job}">
            </label>
            <label>积分
                <input type="text" th:value="${member.integration}" disabled>
            </label>
            <label>成长值
                <input type="text" th:value="${member.growth}" disabled>
            </label>
            <label class="full">个性签名
                <textarea id="sign" th:text="${member.sign}"></textarea>
            </label>
        </div>
        <div class="actions">
            <button type="button" onclick="saveProfile()">保存资料</button>
        </div>
    </div>

    <!-- 修改密码 -->
    <div class="card">
        <h2>修改密码</h2>
        <div class="grid">
            <label>原密码
                <input type="password" id="oldPassword" autocomplete="current-password">
            </label>
            <label>新密码（6-18 位）
                <input type="password" id="newPassword" autocomplete="new-password">
            </label>
            <label>确认新密码
                <input type="password" id="confirmPassword" autocomplete="new-password">
            </label>
        </div>
        <div class="actions">
            <button type="button" onclick="savePassword()">修改密码</button>
        </div>
    </div>

    <!-- 收货地址 -->
    <div class="card">
        <h2>收货地址</h2>
        <div class="addr-list">
            <div class="addr-card" th:each="addr : ${addresses}">
                <div class="line1">
                    <span th:text="${addr.name}"></span>
                    <span th:text="${addr.phone}"></span>
                    <span class="default-tag" th:if="${addr.defaultStatus == 1}">默认</span>
                </div>
                <div class="detail"
                     th:text="${addr.province + addr.city + addr.region + addr.detailAddress}"></div>
                <div class="addr-actions">
                    <button type="button" class="small plain"
                            th:attr="data-id=${addr.id},data-name=${addr.name},data-phone=${addr.phone},data-postCode=${addr.postCode},data-province=${addr.province},data-city=${addr.city},data-region=${addr.region},data-detail=${addr.detailAddress},data-areacode=${addr.areacode},data-default=${addr.defaultStatus}"
                            onclick="editAddress(this)">编辑</button>
                    <button type="button" class="small plain"
                            th:if="${addr.defaultStatus != 1}"
                            th:attr="data-id=${addr.id}" onclick="setDefault(this)">设为默认</button>
                    <button type="button" class="small danger"
                            th:attr="data-id=${addr.id}" onclick="deleteAddress(this)">删除</button>
                </div>
            </div>
            <div class="muted" th:if="${#lists.isEmpty(addresses)}">还没有收货地址，请添加。</div>
        </div>

        <h2 style="margin-top: 22px;" id="addressFormTitle">新增收货地址</h2>
        <div class="grid">
            <input type="hidden" id="addrId">
            <label>收货人
                <input type="text" id="addrName">
            </label>
            <label>手机号
                <input type="text" id="addrPhone">
            </label>
            <label>邮编
                <input type="text" id="addrPostCode">
            </label>
            <label>省份
                <select id="addrProvince"><option value="">请选择省份</option></select>
            </label>
            <label>城市
                <select id="addrCity"><option value="">请选择城市</option></select>
            </label>
            <label>区/县
                <select id="addrRegion"><option value="">请选择区县</option></select>
            </label>
            <label>详细地址
                <input type="text" id="addrDetail">
            </label>
            <label>地区编码
                <input type="text" id="addrAreacode">
            </label>
            <label class="full" style="display:flex;align-items:center;gap:8px;color:#333;">
                <input type="checkbox" id="addrDefault" style="width:auto;margin:0;">
                设为默认收货地址
            </label>
        </div>
        <div class="actions">
            <button type="button" onclick="saveAddress()">保存地址</button>
            <button type="button" class="plain" onclick="resetAddressForm()">清空</button>
        </div>
    </div>
</main>

<div id="toast"></div>

<script th:inline="javascript">
    const needAddress = /*[[${needAddress}]]*/ false;
    const returnUrl = /*[[${returnUrl}]]*/ '';

    function toast(text) {
        const el = document.getElementById('toast');
        el.textContent = text;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 2200);
    }

    function postJson(url, body) {
        return fetch(url, {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        }).then(r => r.json());
    }

    function postForm(url, params) {
        const search = new URLSearchParams(params);
        return fetch(url, {
            method: 'POST',
            credentials: 'same-origin',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: search.toString()
        }).then(r => r.json());
    }

    function val(id) {
        return document.getElementById(id).value.trim();
    }

    // ============================================================
    // 省市区三级联动（数据来自 common 的 /region/* 接口）
    // ============================================================
    let provinceCache = null;
    let cityCache = [];
    let areaCache = [];

    function regionOptions(list, placeholder) {
        return '<option value="">' + placeholder + '</option>' + (list || []).map(item =>
            '<option value="' + item.name + '" data-code="' + item.code + '">' + item.name + '</option>'
        ).join('');
    }

    function fetchProvinces() {
        if (provinceCache) {
            return Promise.resolve(provinceCache);
        }
        return fetch('/region/provinces', {credentials: 'same-origin'})
            .then(r => r.json())
            .then(res => {
                provinceCache = res.data || [];
                return provinceCache;
            });
    }

    function initProvinceSelect() {
        return fetchProvinces().then(list => {
            document.getElementById('addrProvince').innerHTML = regionOptions(list, '请选择省份');
            return list;
        });
    }

    function loadCities(provinceCode) {
        document.getElementById('addrCity').innerHTML = '<option value="">请选择城市</option>';
        document.getElementById('addrRegion').innerHTML = '<option value="">请选择区县</option>';
        cityCache = [];
        areaCache = [];
        if (!provinceCode) {
            return Promise.resolve([]);
        }
        return fetch('/region/cities?provinceCode=' + encodeURIComponent(provinceCode), {credentials: 'same-origin'})
            .then(r => r.json())
            .then(res => {
                cityCache = res.data || [];
                document.getElementById('addrCity').innerHTML = regionOptions(cityCache, '请选择城市');
                return cityCache;
            });
    }

    function loadAreas(cityCode) {
        document.getElementById('addrRegion').innerHTML = '<option value="">请选择区县</option>';
        areaCache = [];
        if (!cityCode) {
            return Promise.resolve([]);
        }
        return fetch('/region/areas?cityCode=' + encodeURIComponent(cityCode), {credentials: 'same-origin'})
            .then(r => r.json())
            .then(res => {
                areaCache = res.data || [];
                document.getElementById('addrRegion').innerHTML = regionOptions(areaCache, '请选择区县');
                return areaCache;
            });
    }

    function selectedCode(id) {
        const select = document.getElementById(id);
        const option = select.options[select.selectedIndex];
        return option ? (option.dataset.code || '') : '';
    }

    function findByName(list, name) {
        return (list || []).find(item => item.name === name) || null;
    }

    function selectByName(id, name) {
        const select = document.getElementById(id);
        if (!name) {
            return;
        }
        for (const option of select.options) {
            if (option.value === name) {
                select.value = name;
                return;
            }
        }
    }

    // 1) 选省 → 清空市/区，加载市
    document.getElementById('addrProvince').addEventListener('change', function () {
        document.getElementById('addrAreacode').value = '';
        loadCities(selectedCode('addrProvince'));
    });

    // 2) 选市 → 清空区，加载区县
    document.getElementById('addrCity').addEventListener('change', function () {
        document.getElementById('addrAreacode').value = '';
        loadAreas(selectedCode('addrCity'));
    });

    // 3) 选区县 → 回填地区编码；数据里带邮编时才回填邮编
    document.getElementById('addrRegion').addEventListener('change', function () {
        document.getElementById('addrAreacode').value = selectedCode('addrRegion');
        const option = this.options[this.selectedIndex];
        const postCode = option ? (option.dataset.postcode || '') : '';
        if (postCode) {
            document.getElementById('addrPostCode').value = postCode;
        }
    });

    // 页面加载时填充省份
    initProvinceSelect();

    function saveProfile() {
        postJson('/member/center/profile', {
            nickname: val('nickname'),
            mobile: val('mobile'),
            email: val('email'),
            header: val('header'),
            gender: Number(document.getElementById('gender').value),
            city: val('city'),
            job: val('job'),
            sign: val('sign')
        }).then(data => {
            if (data.code === 0) {
                toast('资料已保存');
                setTimeout(() => location.reload(), 600);
            } else {
                toast(data.msg || '保存失败');
            }
        }).catch(() => toast('网络异常'));
    }

    function savePassword() {
        const newPassword = val('newPassword');
        if (newPassword !== val('confirmPassword')) {
            toast('两次输入的新密码不一致');
            return;
        }
        postJson('/member/center/password', {
            oldPassword: val('oldPassword'),
            newPassword: newPassword
        }).then(data => {
            if (data.code === 0) {
                toast('密码修改成功');
                document.getElementById('oldPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            } else {
                toast(data.msg || '修改失败');
            }
        }).catch(() => toast('网络异常'));
    }

    function saveAddress() {
        const id = val('addrId');
        const isDefault = document.getElementById('addrDefault').checked;
        const payload = {
            id: id ? Number(id) : undefined,
            name: val('addrName'),
            phone: val('addrPhone'),
            postCode: val('addrPostCode'),
            province: val('addrProvince'),
            city: val('addrCity'),
            region: val('addrRegion'),
            detailAddress: val('addrDetail'),
            areacode: val('addrAreacode'),
            defaultStatus: isDefault ? 1 : 0
        };
        if (!payload.name || !payload.phone || !payload.province || !payload.city
            || !payload.region || !payload.detailAddress) {
            toast('收货人、手机号、省市区和详细地址不能为空');
            return;
        }
        postJson('/member/memberreceiveaddress/' + (id ? 'update' : 'save'), payload)
            .then(data => {
                if (data.code === 0) {
                    toast('地址已保存');
                    if (isDefault && returnUrl) {
                        setTimeout(() => location.href = returnUrl, 500);
                    } else {
                        setTimeout(() => location.reload(), 500);
                    }
                } else {
                    toast(data.msg || '保存失败');
                }
            }).catch(() => toast('网络异常'));
    }

    function editAddress(btn) {
        document.getElementById('addrId').value = btn.dataset.id || '';
        document.getElementById('addrName').value = btn.dataset.name || '';
        document.getElementById('addrPhone').value = btn.dataset.phone || '';
        document.getElementById('addrPostCode').value = btn.dataset.postcode || '';
        document.getElementById('addrDetail').value = btn.dataset.detail || '';
        document.getElementById('addrAreacode').value = btn.dataset.areacode || '';
        document.getElementById('addrDefault').checked = String(btn.dataset.default) === '1';
        document.getElementById('addressFormTitle').textContent = '编辑收货地址';
        document.getElementById('addressFormTitle').scrollIntoView({behavior: 'smooth'});

        // 省市区按名称逐级回显
        const provinceName = btn.dataset.province || '';
        const cityName = btn.dataset.city || '';
        const regionName = btn.dataset.region || '';
        fetchProvinces().then(list => {
            document.getElementById('addrProvince').innerHTML = regionOptions(list, '请选择省份');
            selectByName('addrProvince', provinceName);
            const province = findByName(list, provinceName);
            if (!province) {
                return;
            }
            return loadCities(province.code).then(cities => {
                // 直辖市旧数据 city 可能为空或“北京市”，接口里是“市辖区”
                let city = findByName(cities, cityName);
                if (!city && cities.length > 0) {
                    city = cities[0];
                }
                if (city) {
                    selectByName('addrCity', city.name);
                }
                if (!city) {
                    return;
                }
                return loadAreas(city.code).then(areas => {
                    selectByName('addrRegion', regionName);
                    const region = findByName(areas, regionName);
                    if (region && !btn.dataset.areacode) {
                        document.getElementById('addrAreacode').value = region.code;
                    }
                });
            });
        });
    }

    function resetAddressForm() {
        ['addrId', 'addrName', 'addrPhone', 'addrPostCode', 'addrDetail', 'addrAreacode']
            .forEach(id => document.getElementById(id).value = '');
        document.getElementById('addrCity').innerHTML = '<option value="">请选择城市</option>';
        document.getElementById('addrRegion').innerHTML = '<option value="">请选择区县</option>';
        cityCache = [];
        areaCache = [];
        document.getElementById('addrDefault').checked = false;
        document.getElementById('addressFormTitle').textContent = '新增收货地址';
        initProvinceSelect();
    }

    function setDefault(btn) {
        postForm('/member/memberreceiveaddress/setDefault', {id: btn.dataset.id})
            .then(data => {
                if (data.code === 0) {
                    toast('默认地址已设置');
                    if (returnUrl) {
                        setTimeout(() => location.href = returnUrl, 500);
                    } else {
                        setTimeout(() => location.reload(), 500);
                    }
                } else {
                    toast(data.msg || '设置失败');
                }
            }).catch(() => toast('网络异常'));
    }

    function deleteAddress(btn) {
        if (!confirm('确定删除这条收货地址吗？')) {
            return;
        }
        postForm('/member/memberreceiveaddress/deleteOwn', {id: btn.dataset.id})
            .then(data => {
                if (data.code === 0) {
                    toast('地址已删除');
                    setTimeout(() => location.reload(), 500);
                } else {
                    toast(data.msg || '删除失败');
                }
            }).catch(() => toast('网络异常'));
    }
</script>
    <!-- 谷粒商城 AI 助手：悬浮宠物 + 聊天窗 -->
    <script src="/gulimall/agent/widget/chat-widget.js" defer></script>
</body>
</html>
