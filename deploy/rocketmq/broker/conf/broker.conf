# ============================================================
# RocketMQ Broker 配置（挂到容器 /home/rocketmq/rocketmq-5.3.2/conf/broker.conf）
# 改完执行 docker compose up -d rocketmq-broker 重建容器才生效
# ============================================================

# 集群名 / Broker 名 / Broker ID
# 单机模式：一个集群下只有一个 broker-a，brokerId 固定 0
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# NameServer 地址（容器网络内用 compose 服务名）
# compose 里也设了 NAMESRV_ADDR 环境变量，两处保持一致即可
namesrvAddr = rocketmq-namesrv:9876

# brokerIP1：Broker 注册到 NameServer 的地址，客户端拿到后【直连】它。
# ⚠️ 必须是【虚拟机/宿主机的局域网 IP】，不能写 127.0.0.1、容器名、localhost，
#    否则 Dashboard 正常但 Java 客户端发消息一直超时。
# 这里不写死 IP：由 docker-compose.env 的 VM_HOST_IP 在容器启动时替换 __BROKER_IP__。
brokerIP1 = __BROKER_IP__

# Broker 主端口：生产者/消费者拿到地址后连这里（compose 已映射 10911）
listenPort = 10911

# 单机主节点：没有从节点可同步，只能 ASYNC_MASTER
brokerRole = ASYNC_MASTER

# 刷盘方式：
#   ASYNC_FLUSH —— 异步刷盘，性能好，机器断电时可能丢最近一小段消息
#   SYNC_FLUSH  —— 每条消息落盘后才返回，更可靠但吞吐低
# 生产环境如果要求消息不丢，可改成 SYNC_FLUSH；单机学习环境保持异步即可
flushDiskType = ASYNC_FLUSH

# 开发期自动创建 Topic / 订阅组，第一次发消息不用手工建 Topic
# ⚠️ 生产环境建议改成 false，改为在 Dashboard 或 mqadmin 里显式创建，
#    避免拼错 Topic 名时悄悄创建出一堆垃圾 Topic
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 每个 Topic 默认队列数
defaultTopicQueueNums = 4

# 消息在磁盘上的保留时间（小时），默认 72 小时
fileReservedTime = 72

# 数据目录：CommitLog、ConsumeQueue、索引都在这里面
# 对应 compose 的 ./rocketmq/broker/store 挂载
storePathRootDir = /home/rocketmq/store

# ============================================================
# ACL 认证
# ------------------------------------------------------------
# RocketMQ 5.3.2 是最后一个支持 ACL 1.0 的版本（5.3.3 起删除）。
# 账号清单在 conf/plain_acl.yml（compose 已挂载）。
# 关闭 ACL：把下面改成 false，并删掉 Dashboard 的
#   -Drocketmq.config.accessKey / -Drocketmq.config.secretKey
# 然后重建 broker + dashboard。
# ============================================================
aclEnable = true
