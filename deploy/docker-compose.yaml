# 因为所有安全信息都移出了，配置到config文件中了，因此compose需要建立软连接，这样每次执行命令就无需加载配置文件了
# ln -sf /mydata/app/config/docker-compose.env /mydata/docker/.env

# 查看所有服务：docker compose ps
# 启动指定服务（重建容器）：docker compose up -d 服务名(例如mysql redis)
# 启动全部（首次启动会自动pull）：docker compose up -d
# 停止全部：docker compose stop
# 删除容器（保留数据）：docker compose down
# 查看日志：docker compose logs -f mysql
# 重启某个服务：docker compose restart mysql
# 进入容器：docker exec -it redis7.2 redis-cli

# nacos
# Web API http://<your-vm-host-ip>:8849
# 服务 http://<your-vm-host-ip>:8848
# minIO
# Web API http://<your-vm-host-ip>:19001
# 服务 http://<your-vm-host-ip>:19000
# Elasticsearch
# REST API http://<your-vm-host-ip>:9200
# Kibana   http://<your-vm-host-ip>:5601
# Nginx 统一入口（站点靠 Host 区分，访问端需配 hosts 指到 <your-vm-host-ip>）
#   gulimall.vip       → 客户端页面 + /gulimall/** 微服务接口 + /es/fenci.txt 词库
#   admin.gulimall.vip → 管理端页面 + /gulimall/** 所有接口
#   img.gulimall.vip   → MinIO 图片
# RabbitMQ 管理控制台（账号密码见 config/docker-compose.env）
#   http://<your-vm-host-ip>:15672
# RocketMQ
#   NameServer  <your-vm-host-ip>:9876（客户端先连它拿 Broker 地址）
#   Broker      <your-vm-host-ip>:10911（真正收发消息的端口）
#   Dashboard   http://<your-vm-host-ip>:8180（ACL 账号见 config/docker-compose.env）
# Seata 控制台需要Tomcat，非官方容器无法启动
# http://<your-vm-host-ip>:7091
# Sentinel
# http://<your-vm-host-ip>:8858
# Milvus控制台
# http://<your-vm-host-ip>:9091/webui

services:

  # ==========================
  # MySQL 数据库
  # ==========================
  mysql:
    # MySQL 官方镜像
    image: mysql:8.4.11

    # 容器名称
    container_name: mysql8.4.11

    # 开机自动启动
    restart: always

    ports:
      # 宿主机3306 -> 容器3306
      # 数据库客户端通过服务器IP:3306连接
      - "3306:3306"

    environment:
      # 初始化root密码
      # 注意：
      # 只有第一次初始化数据目录时生效
      # 后续修改密码需要进入MySQL执行SQL
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      # MySQL日志目录
      # 保存错误日志、慢查询日志等
      - ./mysql/log:/var/log/mysql

      # MySQL数据目录
      # 保存数据库表文件、索引文件
      # 删除容器不会删除数据
      - ./mysql/data:/var/lib/mysql

      # MySQL配置文件目录
      # 自动读取目录下 *.cnf 文件
      - ./mysql/conf:/etc/mysql/conf.d


  # ==========================
  # Redis缓存数据库
  # ==========================
  redis:

    # Redis官方镜像
    # 7.2属于LTS长期支持版本
    image: redis:7.2.12

    # 容器名称
    container_name: redis7.2

    # 自动重启
    restart: always

    ports:
      # 宿主机6379 -> Redis6379
      - "6379:6379"

    # ⚠️ 必须显式指定配置文件：官方镜像的默认启动命令就是光秃秃的 redis-server，
    #    不会去读挂载进来的 /conf/redis.conf —— 之前这个文件其实一直没生效。
    # 密码用命令行参数传，因为 redis.conf 不支持 ${VAR} 插值。
    command:
      - redis-server
      - /conf/redis.conf
      - --requirepass
      # ${VAR:?提示语} = 变量没设就【直接启动失败并打出这行提示】，
      # 而不是默默替换成空串（那样 Redis 会以"空密码"启动，问题极难发现）
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请检查 config/docker-compose.env 并加 --env-file 参数}

    volumes:
      # Redis数据持久化目录
      # 保存RDB/AOF文件
      - ./redis/data:/data

      # Redis配置文件
      # 宿主机redis.conf映射到容器
      # Redis启动时加载该配置
      - ./redis/conf/redis.conf:/conf/redis.conf

      # Redis日志目录
      # 保存Redis运行日志
      - ./redis/log:/var/log/redis


  # ==========================
  # Nacos 注册中心 & 配置中心
  # ==========================
  nacos:
    # Nacos官方镜像
    # 与客户端 nacos-client 3.0.3 配套
    image: nacos/nacos-server:v3.0.3

    # 容器名称
    container_name: nacos3.0.3

    # 自动重启
    restart: always

    ports:
      # 宿主机8848 -> Nacos8848
      # HTTP接口：控制台 + 配置中心 + 服务注册API
      - "8848:8848"

      # 宿主机9848 -> Nacos9848
      # gRPC接口：客户端与服务端长连接通信
      - "9848:9848"

      # Web控制台
      # 用户名 nacos
      # 密码 nacos
      - "8849:8080"

    environment:
      # 单机模式（standalone）无需集群
      MODE: standalone

      # Nacos 2.2.1+ 必须显式配置认证变量，否则启动报错
      # 生产环境请用 openssl rand -base64 32 重新生成 token
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN}"
      NACOS_AUTH_IDENTITY_KEY: "nacos_identity_key"
      NACOS_AUTH_IDENTITY_VALUE: "nacos_identity_value"

      # 时区
      TZ: Asia/Shanghai

    volumes:
      # Nacos数据目录（单机Derby存储）
      # 删除容器不会丢数据
      - ./nacos/data:/home/nacos/data

      # Nacos日志目录
      - ./nacos/logs:/home/nacos/logs

    # 健康检查：Nacos 真正 ready 后才算 healthy。
    # /nacos/v1/ns/operator/metrics 返回 {"status":"UP"}，不需要账号密码；
    # 这样 seata-server 可以等 Nacos 能注册服务后再启动，避免启动时 Connection refused。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/ns/operator/metrics || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Nacos 启动通常要 10～20 秒，前 30 秒失败不算 unhealthy
      start_period: 30s


  # ==========================
  # MinIO 对象存储（单服务器模式）
  # ==========================
  minio:
    # MinIO 官方镜像（latest 跟随更新，如需固定版本改成具体 RELEASE 版本）
    image: minio/minio:latest

    # 容器名称
    container_name: minio

    # 开机自动重启
    restart: always

    ports:
      # 9000端口被gulimall服务占用了，映射的时候换一个
      # 宿主机19000 -> MinIO容器9000（容器内 MinIO 固定监听 9000，映射的宿主机端口可改，右侧不要动）
      # API 端口：应用（Java/SDK）上传下载文件走这里
      # http://${VM_HOST_IP}:19000
      - "19000:9000"
      # 宿主机19001 -> MinIO容器9001（容器内固定 9001）
      # Web 控制台：浏览器访问 http://${VM_HOST_IP}:19001 管理 bucket/文件
      # http://${VM_HOST_IP}:19001
      - "19001:9001"

    environment:
      # 根账号 / 根密码（部署时务必改成强密码，长度至少 8 位！）
      # 忘记/修改见 MinIO 官方文档
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      # 改密码时把尖括号占位替换成你的强密码，保留引号（密码含特殊字符也不会解析出错）
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

      # 时区
      TZ: Asia/Shanghai

    volumes:
      # 数据持久化：保存对象数据（删除容器不会丢数据）
      - ./minio/data:/data

      # 配置目录：保存 MinIO 自身配置
      - ./minio/config:/root/.minio

    command:
      # 单节点启动（server 指向数据目录 /data）
      # --console-address ":9001"：固定控制台监听容器内 9001（否则 MinIO 用随机端口，控制台映射 19001 会连不上）
      - server
      - /data
      - --console-address
      - ":9001"

    # ============================================================
    # 【多服务器 / 分布式模式】—— 后期扩容到多台服务器时启用
    # ------------------------------------------------------------
    # 目前单服务器用上面的单机 command 即可。若后期扩到 ≥4 台服务器
    # 组成 MinIO 集群（纠删码模式，数据分散多节点冗余），把上面的
    # command 注释掉，改用下方写法（每台机器跑同一个 compose，
    # 把 4 个 IP 都写成全部节点地址，各节点数据目录一致为 /data）：
    #
    #   command:
    #     - server
    #     - "http://<your-k8s-master-ip>:9000/data"
    #     - "http://<your-k8s-node-ip>:9000/data"
    #     - "http://192.168.10.203:9000/data"
    #     - "http://192.168.10.204:9000/data"
    #
    # 注意：
    #   - 分布式至少 4 个节点；纠删码盘数 = 节点数 × 每节点盘数，
    #     必须为偶数（4/6/8…），否则启动报错。
    #   - 每台服务器需先建好数据目录并确保磁盘独立，不能共享同一物理盘。
    #   - 集群所有节点密码必须一致。
    # 更完整的分布式编排可参考 MinIO 官方文档：
    #   https://min.io/docs/minio/linux/operations/install-deploy-manage/deploy-minio-multi-node.html
    # ============================================================


  # ==========================
  # Elasticsearch 全文搜索引擎（商品检索）
  # ==========================
  elasticsearch:
    # 官方镜像
    # 8.18.x 与 Spring Boot 3.5.16 管理的 elasticsearch-java 客户端 8.18.x 配套
    # （Spring Data Elasticsearch 5.5 对应 ES 8.18，两端大版本必须一致）
    # 若 Docker Hub 拉取慢/无该 tag，可换官方源：
    #   docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    image: elasticsearch:8.18.8

    # 容器名称
    container_name: elasticsearch8.18.8

    # 开机自动启动
    restart: always

    ports:
      # 宿主机9200 -> ES9200
      # REST API 端口：Java 客户端 / curl / Kibana 都走这里
      # http://${VM_HOST_IP}:9200
      - "9200:9200"

      # 宿主机9300 -> ES9300
      # 节点间内部通信端口，单节点模式用不到，只有组集群时才需要放开
      # - "9300:9300"

    environment:
      # 说明：ES 的配置项统一放在 ./es/config/elasticsearch.yml（挂载进容器）
      #      这里只留【yml 里写无效、必须用环境变量】的两项

      # JVM 堆内存：ES 默认会吃宿主机一半内存，虚拟机部署必须限制
      # 否则容易把 MySQL/Nacos 等服务挤爆，按服务器内存酌情调到 1g
      # （-Xms/-Xmx 两值必须相等；这是 JVM 参数，yml 配置文件里无处可写）
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

      # 超级用户 elastic 的密码
      # （由镜像 entrypoint 读取用于初始化，不是 ES 配置项，yml 里写无效）
      # 部署前务必改成强密码，至少 8 位；且只在首次初始化数据目录时生效
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}

      # 时区
      TZ: Asia/Shanghai

    volumes:
      # 配置文件：覆盖容器内同名文件（ES 的配置项都写在里面）
      # ⚠️ 首次启动前宿主必须【已存在】该文件 —— 若不存在，Docker 会把它
      #    创建成一个同名【目录】，导致 ES 启动报配置读取错误
      # ⚠️ 覆盖挂载后镜像预置的 network.host 会丢，文件里已显式补回，别删
      - ./es/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml

      # 数据目录：保存索引/文档数据（删除容器不会丢数据）
      # ⚠️ 首次启动前必须在宿主机授权，否则容器启动报
      #    "AccessDeniedException: /usr/share/elasticsearch/data"
      #    ES 容器内以 uid 1000 运行，执行：
      #      mkdir -p ./es/config ./es/data ./es/plugins
      #      chown -R 1000:1000 ./es/config ./es/data ./es/plugins   （Linux）
      - ./es/data:/usr/share/elasticsearch/data

      # 插件目录：挂到宿主机方便装 IK 中文分词器（商品搜索中文分词必需）
      # 装法见 Deploy组件一览.md「IK 中文分词器」章节
      - ./es/plugins:/usr/share/elasticsearch/plugins

    healthcheck:
      # 开了 security 后根路径返回 401，探测必须带上账号密码
      # 用 _cluster/health：集群可用即返回 200
      # ⚠️ 改 ELASTIC_PASSWORD 时必须同步改这里的密码，否则 ES 永远不健康，
      #    依赖它健康的 Kibana 会一直起不来
      test: ["CMD-SHELL", "curl -fsS -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      # ES 首次启动较慢，留足 90s 再开始计失败，避免误判
      start_period: 90s


  # ==========================
  # Kibana 可视化控制台（ES 配套）
  # ==========================
  kibana:
    # 版本必须与 Elasticsearch 完全一致，否则连接报版本不匹配
    image: kibana:8.18.8

    # 容器名称
    container_name: kibana8.18.8

    # 自动重启
    restart: always

    # 等 ES 健康（healthcheck 通过）后再启动
    # 否则 Kibana 启动期连不上 ES 会直接报错退出
    depends_on:
      elasticsearch:
        condition: service_healthy

    ports:
      # 宿主机5601 -> Kibana5601
      # 控制台地址 http://${VM_HOST_IP}:5601
      - "5601:5601"

    environment:
      # 说明：Kibana 的配置项统一放在 ./kibana/config/kibana.yml（挂载进容器）
      #      这里只留 yml 里写无效的时区

      # 时区
      TZ: Asia/Shanghai

      # 连 ES 的密码：Kibana 支持用「大写设置名」的环境变量覆盖 kibana.yml，
      # kibana.yml 里那行明文密码已经删掉了
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD}

    volumes:
      # 配置文件：覆盖容器内同名文件
      # 内含 ES 连接信息、加密密钥（xpack.*.encryptionKey）、界面语言等
      # ⚠️ 首次启动前宿主必须【已存在】该文件，否则 Docker 会把它创建成同名【目录】
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml


  # ==========================
  # Nginx 统一入口
  # ==========================
  # 三个站点靠【请求头 Host】区分（nginx 用 server_name 匹配），
  # 所以访问端必须配 hosts，用 IP 访问匹配不上 admin / img 站点。
  #
  #   gulimall.vip
  #     /              → 反代 host.docker.internal:10000（客户端页面，由 gulimall-product 用 Thymeleaf 渲染）
  #     /gulimall/**   → 反代网关 :88（微服务接口，原样透传，不做 rewrite）
  #     /es/fenci.txt  → 本地静态（IK 远程词库，禁缓存）
  #
  #   admin.gulimall.vip
  #     /              → 本地静态 html/admin/（renren-fast-vue 构建产物）
  #     /gulimall/**   → 反代网关 :88（管理端所有接口，含 renren-fast 自身的）
  #
  #   img.gulimall.vip
  #     /              → 反代 MinIO:9000（图片域名化，地址与 MinIO 部署解耦）
  #
  # 站点明细在 ./nginx/conf/conf.d/gulimall.conf（已逐行注释）
  #
  # 对外只暴露这一个端口，后端服务（网关 88、各微服务 10000+）不再直接对外
  # —— 这是「统一入口」的意义：以后上 HTTPS 只在这里装证书。
  nginx:
    # 官方镜像
    # 1.28 是当前 stable 分支（1.29 是 mainline，生产不用）
    # alpine 变体体积小；如需完全固定补丁版，先 docker pull 验证存在后再改具体版本号
    image: nginx:1.28-alpine

    # 容器名称
    container_name: nginx

    # 开机自动重启
    restart: always

    # 等 minio 创建好再启动 nginx。
    # 原因：nginx 在【加载配置时】就会解析配置里的服务名，而 conf.d 下有多处
    #       proxy_pass http://minio:9000（img.gulimall.vip 站点 + 各站点的 /img/ 路由）
    #       —— 名字解析不了，nginx 会直接启动失败（不是运行时 502，是根本起不来）。
    # 为什么用 service_started 而不是 service_healthy：MinIO 没配 healthcheck。
    #       容器一旦创建入网，DNS 就能解析这个名字；nginx 启动时【并不会连】9000，
    #       所以"已启动"就够了，不需要等它真的能服务。
    # （kibana 依赖 elasticsearch 用的是 service_healthy，因为 ES 配了 healthcheck）
    depends_on:
      minio:
        condition: service_started

    ports:
      # 宿主机80 -> Nginx80，对外唯一入口（靠【域名】区分站点）
      # ⚠️ 访问端必须配 hosts 才能解析这些域名。
      # 以后上 HTTPS 再加一行 "443:443"
      - "80:80"

    environment:
      TZ: Asia/Shanghai

    # 让容器内能用 host.docker.internal 指回【宿主机】
    # 因为网关 gulimall-gateway 是跑在宿主机上的 Java 进程，不是容器
    # （host-gateway 是 Docker 20.10+ 的保留值，Linux 上需显式声明才有这个名字）
    extra_hosts:
      # 本地开发：Java 服务跑在 Windows 上 （WindowsIP <your-windows-host-ip>）
      - "host.docker.internal:${WINDOWS_HOST_IP}"

    volumes:
      # 主配置：覆盖镜像自带的 /etc/nginx/nginx.conf
      # ⚠️ 宿主必须【已存在】该文件，否则 Docker 会把它创建成同名【目录】，启动报错
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro

      # 站点配置目录：每个 .conf 文件一个 server 块
      # （挂空目录会顶掉镜像自带的 default.conf，正是我们想要的）
      - ./nginx/conf/conf.d:/etc/nginx/conf.d:ro

      # 静态资源根目录：前端 dist、IK 词库都放这里
      # 容器内只读，防止容器进程意外改写宿主文件
      - ./nginx/html:/usr/share/nginx/html:ro

      # 证书目录（HTTPS 用，先预留；没证书时留空目录即可）
      - ./nginx/certs:/etc/nginx/certs:ro

    # 说明：这里【没有】挂载日志目录
    # 官方镜像预置了 access.log/error.log → /dev/stdout、/dev/stderr 的软链接，
    # 一旦挂载宿主目录就会把这些软链接覆盖掉，日志改落文件、docker compose logs 就看不到了。
    # 保持现状 → 用 docker compose logs -f nginx 查看（与其他服务一致）。
    # 生产要落文件 + logrotate 时，再加：
    #   - ./nginx/logs:/var/log/nginx


  # ==========================
  # RabbitMQ 消息队列
  # ==========================
  # 用途：订单超时自动取消（延迟队列）、库存解锁、秒杀削峰
  #
  # 端口只开两个（其余单机用不到，故意不映射，等真要组集群/换协议时再放开）：
  #   5672   AMQP 协议端口 —— Java 应用（spring-boot-starter-amqp）连的就是它
  #   15672  Web 管理控制台 http://${VM_HOST_IP}:15672
  #   4369 / 25672  Erlang 发现 & 集群通信：只有组集群才需要
  #   5671          AMQP over TLS：走证书加密时才用
  #   61613 / 61614 STOMP 协议；1883 / 8883 MQTT 协议：不用这两个协议就不用开
  rabbitmq:
    # 官方镜像。选 3.13 而不是 4.x：【延迟消息插件】对 3.13 有现成版本，
    # 订单超时要用延迟队列，4.x 线的插件兼容性还不确定
    image: rabbitmq:3.13.7-management

    # 容器名称
    container_name: rabbitmq3.13.7

    # 自动重启
    restart: always

    ports:
      # 宿主机5672 -> 容器5672（AMQP）
      - "5672:5672"

      # 宿主机15672 -> 容器15672（管理控制台）
      - "15672:15672"

    environment:
      # 默认账号：镜像启动时创建这个用户，同时【不再创建 guest】
      # （guest 默认只能从本机登录，Java 进程在宿主机/别的机器上连不上）
      # ${VAR:?提示语} = 变量没设就直接启动失败并打出提示，而不是默默变成空密码
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME 未设置，请检查 config/docker-compose.env 并加 --env-file 参数}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 未设置，请检查 config/docker-compose.env 并加 --env-file 参数}

      # 时区
      TZ: Asia/Shanghai

      # 启动时自动启用插件（延迟消息交换机 x-delayed-message，订单超时自动取消要用）
      # ⚠️ 必须把 rabbitmq_management 一起列上 —— 设了这个变量，镜像会用它【覆盖】默认的
      #    enabled_plugins 文件，只写延迟插件的话管理控制台（15672）就打不开了。
      # ⚠️ 这里【不要】写 RABBITMQ_ENABLED_PLUGINS：它要求 broker 进程（uid 999）去写
      #    /etc/rabbitmq/enabled_plugins，写不进去就启动失败：
      #      Error during startup: {error,failed_to_update_enabled_plugins_file}
      #    改成挂一个【可写】的清单文件进去（见下面 volumes 的 enabled_plugins 那行）。

    volumes:
      # 数据目录：队列定义、消息、用户、Erlang cookie 都在这里（删除容器不会丢数据）
      # ⚠️ 首次启动前必须授权，否则容器内以 uid 999（rabbitmq 用户）运行、写不进去会启动失败：
      #      mkdir -p ./rabbitmq/data
      #      chown -R 999:999 ./rabbitmq/data      （Linux）
      - ./rabbitmq/data:/var/lib/rabbitmq

      # 延迟消息插件：⚠️ 只能挂【单个 .ez 文件】，绝对不能挂整个目录！
      #    镜像自带的插件（RabbitMQ 服务端自己的 .beam 模块）就住在容器的 /plugins 里，
      #    挂整个宿主目录上去会把它们全盖掉 → 容器启动即崩、无限重启，日志是：
      #      Error! Failed to load module 'rabbit' because it cannot be found
      # ⚠️ 宿主上这个 .ez 必须【先存在】再 up，否则 Docker 会把它建成同名【目录】（ES/Kibana/nginx 同一个坑）
      # ⚠️ 以后换插件版本：这行的文件名要跟着改
      - ./rabbitmq/plugins/rabbitmq_delayed_message_exchange-3.13.0.ez:/plugins/rabbitmq_delayed_message_exchange-3.13.0.ez:ro

      # 插件清单：直接挂【文件】（不要加 :ro —— broker 可能需要更新它）
      # 内容就是 [rabbitmq_management,rabbitmq_delayed_message_exchange].
      # ⚠️ 宿主上这个文件必须【先存在】再 up（仓库里 deploy/rabbitmq/conf/ 下已备好）
      - ./rabbitmq/conf/enabled_plugins:/etc/rabbitmq/enabled_plugins

      # 其它配置（这里是磁盘水位 disk_free_limit）：挂【单个文件】到 conf.d，
      # 别挂整个 conf.d 目录 —— 会把镜像自带的配置一起盖掉（和上面 /plugins 一个道理）
      - ./rabbitmq/conf/rabbitmq.conf:/etc/rabbitmq/conf.d/10-gulimall.conf:ro

    # 和 nginx 一样【不挂日志目录】：镜像把日志打到 stdout，
    # 一挂宿主目录就看不到 docker compose logs 了（看日志用 docker compose logs -f rabbitmq）


  # ==========================
  # RocketMQ NameServer（注册中心 / "电话簿"）
  # ==========================
  # 生产者/消费者先连 NameServer，问它"某个 Topic 的 Broker 在哪"。
  # NameServer 只存地址、不存消息，所以它没有数据目录要挂。
  #
  # ⚠️ 版本固定 5.3.2，别随手升 5.3.4：
  #    5.3.3 起官方删除了 ACL 1.0（aclEnable + plain_acl.yml），
  #    而 rocketmq-spring-boot-starter 2.3.x 用的是 Remoting 协议 + ACL 1.0。
  #    升级版本前先看 Deploy组件一览.md「RocketMQ」一节的说明。
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2

    container_name: rocketmq-namesrv

    # 业务未使用 RocketMQ；不随 Docker/开机自启，需要时手动 start
    restart: "no"

    ports:
      # 宿主机9876 -> NameServer9876
      # 客户端第一步连它拿 Broker 地址
      - "9876:9876"

    environment:
      # 限制 JVM 堆：不限制会按宿主机内存的一半申请，和 MySQL/ES 抢内存
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
      TZ: Asia/Shanghai

    volumes:
      # 日志目录：镜像把日志写文件（rocketmqlogs/namesrv.log），不写 stdout
      # ⚠️ 容器内以 uid 3000 运行，首次启动前要：
      #      mkdir -p ./rocketmq/namesrv/logs
      #      chown -R 3000:3000 ./rocketmq/namesrv
      - ./rocketmq/namesrv/logs:/home/rocketmq/logs

    command: sh mqnamesrv


  # ==========================
  # RocketMQ Broker（真正存消息的 "邮局"）
  # ==========================
  rocketmq-broker:
    image: apache/rocketmq:5.3.2

    container_name: rocketmq-broker

    # 业务未使用 RocketMQ；不随 Docker/开机自启，需要时手动 start
    restart: "no"

    # 等 NameServer 容器创建后再启动（容器入网后 DNS 就能解析服务名）
    depends_on:
      - rocketmq-namesrv

    ports:
      # 宿主机10911 -> Broker10911
      # Broker 主端口：生产者/消费者拿到地址后连这里
      - "10911:10911"

      # 宿主机10909 -> Broker10909
      # VIP 通道：老客户端会走，保留
      - "10909:10909"

      # 10912 是主从复制的 HA 端口，单机模式用不到，不映射

    environment:
      # 容器内用 compose 服务名找 NameServer
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
      TZ: Asia/Shanghai

    volumes:
      # ⚠️ 下面两个配置文件必须【先在宿主机存在】再 up，
      #    否则 Docker 会把挂载点建成同名【目录】（ES/Kibana/nginx 同一个坑）
      #
      # broker.conf：集群名、brokerIP1、刷盘方式、ACL 开关
      # broker.conf 是模板：brokerIP1 用 __BROKER_IP__ 占位，
      # 启动时由 command 用 VM_HOST_IP 替换后生成真实配置
      - ./rocketmq/broker/conf/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf.template:ro

      # plain_acl.yml：ACL 1.0 账号清单（accessKey/secretKey）
      # ⚠️ 部署前要把里面的 secretKey 改成和 config/docker-compose.env 一致
      - ./rocketmq/broker/conf/plain_acl.yml:/home/rocketmq/rocketmq-5.3.2/conf/plain_acl.yml:ro

      # 消息数据：CommitLog、ConsumeQueue、索引都在这里（删除容器不会丢数据）
      # ⚠️ 首次启动前 chown -R 3000:3000（容器内 uid 3000）
      #     目录不可写时容器退出码是 253
      - ./rocketmq/broker/store:/home/rocketmq/store

      # 日志目录：rocketmqlogs/broker.log
      - ./rocketmq/broker/logs:/home/rocketmq/logs

    command: sh -c "sed 's/__BROKER_IP__/${VM_HOST_IP:?VM_HOST_IP 未设置，请检查 config/docker-compose.env}/g' /home/rocketmq/rocketmq-5.3.2/conf/broker.conf.template > /home/rocketmq/broker.conf && sh mqbroker -c /home/rocketmq/broker.conf"


  # ==========================
  # RocketMQ Dashboard（网页控制台）
  # ==========================
  rocketmq-dashboard:
    # 固定 2.1.0，不用 latest（避免镜像更新后端口/配置默认值变化）
    image: apacherocketmq/rocketmq-dashboard:2.1.0

    container_name: rocketmq-dashboard

    # 业务未使用 RocketMQ；不随 Docker/开机自启，需要时手动 start
    restart: "no"

    depends_on:
      - rocketmq-namesrv

    ports:
      # 宿主机8180 -> 容器8082
      # 宿主机 8080 被 renren-fast 占了，所以换 8180
      # 浏览器访问 http://${VM_HOST_IP}:8180
      - "8180:8082"

    environment:
      TZ: Asia/Shanghai

      # 固定 Dashboard 的监听端口（Spring Boot 的 server.port）
      # 这样不管镜像默认是 8080 还是 8082，端口映射都稳定
      SERVER_PORT: "8082"

      # Dashboard 连 NameServer / Broker 用。
      # 开了 ACL 必须带 accessKey/secretKey，且要和 plain_acl.yml 完全一致，
      # 否则集群页空白、创建 Topic 等操作会被拒绝。
      # ${VAR:?提示语} = 变量没设就直接启动失败并打出这行提示
      # ⚠️ secretKey 不要带空格/换行，否则 java $JAVA_OPTS 会被拆坏
      JAVA_OPTS: >-
        -Xms256m -Xmx256m
        -Drocketmq.namesrv.addr=rocketmq-namesrv:9876
        -Drocketmq.config.accessKey=${ROCKETMQ_ACCESS_KEY:?ROCKETMQ_ACCESS_KEY 未设置，请检查 config/docker-compose.env 并加 --env-file 参数}
        -Drocketmq.config.secretKey=${ROCKETMQ_SECRET_KEY:?ROCKETMQ_SECRET_KEY 未设置，请检查 config/docker-compose.env 并加 --env-file 参数}


  # ==========================
  # Seata 分布式事务协调器
  # ==========================
  seata-server:
    # Seata官方镜像
    image: apache/seata-server:2.5.0.jdk21

    # 容器名称
    container_name: seata2.5

    # 自动重启
    restart: always

    # 等 Nacos healthy 后再启动（Seata 启动时要注册到 Nacos）。
    # 不能只写 service_started：Nacos 容器刚创建时 8848 可能还没 ready，
    # Seata 会报 NacosException: Connection refused，然后反复重启。
    depends_on:
      nacos:
        condition: service_healthy

    ports:
      # 宿主机7091 -> Seata7091
      # Seata控制台
      - "7091:7091"

      # 宿主机8091 -> Seata8091
      # 分布式事务服务端口
      - "8091:8091"

    environment:
      # 注册到 Nacos 的宿主机局域网 IP：客户端按这个地址直连 Seata，
      # 不能写 0.0.0.0 / 容器名，否则客户端连不上。
      SEATA_IP: ${VM_HOST_IP}
      # 事务服务端口（控制台是 application.yml 里的 server.port=7091）
      SEATA_PORT: "8091"
      # 时区
      TZ: Asia/Shanghai

    volumes:
      # 只挂载 application.yml（registry指向Nacos）
      # 不要挂整个 seata-config 目录，否则会覆盖镜像自带的 logback-spring.xml 等文件
      - ./seata-config/application.yml:/seata-server/resources/application.yml:ro


  # ==========================
  # Sentinel 限流/熔断/降级控制台
  # ==========================
  sentinel-dashboard:
    # 社区镜像（阿里官方未发布 Docker 镜像，官方只有 jar）
    # 与客户端 sentinel 1.8.9 配套
    image: bladex/sentinel-dashboard:1.8.9
    container_name: sentinel1.8.9
    restart: always
    ports:
      # 控制台地址 http://服务器IP:8858
      # 默认账号密码：sentinel / sentinel
      - "8858:8858"
    environment:
      TZ: Asia/Shanghai

  # ==========================
  # Jaeger 调用链监控（OTLP）
  # ==========================
  jaeger:
    # Jaeger v2：内置 OTel Collector，原生接收 OTLP
    image: jaegertracing/jaeger:2.6.0
    container_name: jaeger2.6.0
    restart: always
    ports:
      # Web UI
      - "16686:16686"
      # OTLP gRPC（Java 客户端默认走 4318 HTTP，保留 gRPC 供其他客户端）
      - "4317:4317"
      # OTLP HTTP
      - "4318:4318"
    environment:
      TZ: Asia/Shanghai

  # ==========================
  # Milvus 向量数据库（RAG）
  # ==========================
  # 三个容器缺一不可：
  #   milvus-etcd  存 Milvus 的元数据（集合、分区、索引定义）
  #   milvus-minio 存向量索引文件（与业务 minio 隔离，避免误删）
  #   milvus       真正的向量检索引擎，端口 19530
  # 首次启动前宿主目录授权和内存要求见 Deploy组件一览.md「Milvus / 向量库」。
  milvus-etcd:
    image: ${MILVUS_ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.18}
    container_name: milvus-etcd
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      TZ: Asia/Shanghai
    volumes:
      - ./milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: minio/minio:latest
    container_name: milvus-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_SECRET_KEY}
      TZ: Asia/Shanghai
    volumes:
      - ./milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.5.10}
    container_name: milvus2.5.10
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY}
      COMMON_STORAGE_TYPE: minio
      TZ: Asia/Shanghai
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_DEFAULTROOTPASSWORD: ${MILVUS_ROOT_PASSWORD}
    volumes:
      - ./milvus/data:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC，Java 客户端连接
      - "9091:9091"     # 健康检查/监控
    depends_on:
      - milvus-etcd
      - milvus-minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: ${MILVUS_MEM_LIMIT:-2g}