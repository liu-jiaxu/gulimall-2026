<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>确认秒杀订单 - 谷粒商城</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Microsoft YaHei", Arial, sans-serif; background: #f5f5f5; color: #333; }
        header { background: #e1251b; color: #fff; padding: 18px 40px; }
        header h1 { margin: 0; font-size: 24px; }
        main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .product { display: flex; gap: 18px; }
        .product img { width: 160px; height: 160px; object-fit: contain; background: #fafafa; }
        .product h2 { font-size: 18px; margin: 0 0 10px; }
        .price b { color: #e1251b; font-size: 26px; }
        .price s { color: #999; margin-left: 8px; }
        .meta { color: #666; font-size: 14px; margin-top: 8px; }
        label { display: block; margin: 14px 0; font-size: 14px; }
        input[type=number], select { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .default-address { padding: 10px 12px; margin-top: 6px; background: #fafafa; border: 1px solid #eee; border-radius: 4px; font-size: 14px; color: #333; }
        button { width: 100%; padding: 14px; border: 0; border-radius: 4px; background: #e1251b; color: #fff; font-size: 18px; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .warn { color: #e1251b; font-size: 14px; margin: 10px 0; }
        #msg { text-align: center; color: #666; min-height: 24px; }
    </style>
</head>
<body>
<header><h1>确认秒杀订单</h1></header>
<main>
    <div class="card">
        <div class="product">
            <img th:src="${info.sku.skuImg}" alt="">
            <div>
                <h2 th:text="${info.sku.skuName}">商品名称</h2>
                <div class="price">
                    <b th:text="'¥' + ${#numbers.formatDecimal(info.sku.seckillPrice, 1, 2)}">0.00</b>
                    <s th:text="'¥' + ${#numbers.formatDecimal(info.sku.skuPrice, 1, 2)}">0.00</s>
                </div>
                <div class="meta"
                     th:text="'每人限购 ' + ${info.limit} + ' 件，已购 ' + ${info.bought} + ' 件，剩余 ' + ${info.stock} + ' 件'">
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <form id="seckillForm" onsubmit="return false;">
            <label>购买数量
                <input type="number" id="quantity" min="1" th:max="${maxQuantity}" th:value="${quantity}">
            </label>
            <label>收货地址（默认）</label>
            <div class="default-address"
                 th:text="${defaultAddress.name + ' ' + defaultAddress.phone + ' '
                         + defaultAddress.province + defaultAddress.city + defaultAddress.region
                         + defaultAddress.detailAddress}">
            </div>
            <div class="warn" th:if="${maxQuantity <= 0}">
                已抢光或已达到限购数量，无法继续购买。
            </div>
            <button type="button" id="submitBtn"
                    th:disabled="${defaultAddress == null or maxQuantity <= 0}">提交抢购</button>
            <p id="msg"></p>
        </form>
    </div>
</main>

<script th:inline="javascript">
    const sessionId = /*[[${info.sku.promotionSessionId}]]*/ 0;
    const skuId = /*[[${info.sku.skuId}]]*/ 0;
    const randomCode = /*[[${info.sku.randomCode}]]*/ '';
    const orderUrl = /*[[${orderUrl}]]*/ '';
    const addrId = /*[[${defaultAddress.id}]]*/ 0;
    const maxQuantity = /*[[${maxQuantity}]]*/ 0;
    const requestId = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Date.now()) + Math.random().toString(16).slice(2);

    function msg(text) {
        document.getElementById('msg').textContent = text || '';
    }

    async function poll(orderSn) {
        for (let i = 0; i < 40; i++) {
            msg('排队建单中，请稍候...');
            try {
                const resp = await fetch('/seckill/order/result?orderSn=' + encodeURIComponent(orderSn), {
                    credentials: 'same-origin'
                });
                const json = await resp.json();
                if (json.code === 0) {
                    const status = json.seckillOrder.status;
                    if (status === 1) {
                        location.href = orderUrl + '/pay.html?orderSn=' + encodeURIComponent(orderSn);
                        return;
                    }
                    if (status === 3) {
                        msg('建单失败，库存已退回：' + (json.seckillOrder.failReason || ''));
                        return;
                    }
                }
            } catch (e) {
                // 网络抖动继续轮询
            }
            await new Promise(r => setTimeout(r, 1000));
        }
        msg('建单处理中，请稍后到订单列表查看');
    }

    document.getElementById('submitBtn').onclick = async function () {
        const quantity = parseInt(document.getElementById('quantity').value || '1');
        if (!addrId) {
            msg('没有默认收货地址，请先到个人中心设置');
            return;
        }
        if (quantity < 1 || quantity > maxQuantity) {
            msg('数量必须在 1 到 ' + maxQuantity + ' 之间');
            return;
        }

        this.disabled = true;
        msg('正在抢购...');
        try {
            const resp = await fetch('/seckill/order/submit', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    requestId: requestId,
                    sessionId: sessionId,
                    skuId: skuId,
                    quantity: quantity,
                    addrId: addrId,
                    payType: 1,
                    randomCode: randomCode
                })
            });
            const json = await resp.json();
            if (json.code !== 0) {
                msg(json.msg || '抢购失败');
                this.disabled = false;
                return;
            }
            await poll(json.seckillOrder.orderSn);
        } catch (e) {
            msg('网络异常，请稍后重试');
            this.disabled = false;
        }
    };
</script>
    <!-- 谷粒商城 AI 助手：悬浮宠物 + 聊天窗 -->
    <script src="/gulimall/agent/widget/chat-widget.js" defer></script>
</body>
</html>
