#################################
# Redis基础配置
#################################


# Redis端口
port 6379

# 允许外部访问
# Docker环境需要开启
bind 0.0.0.0

# 关闭保护模式
protected-mode no


#################################
# 密码配置
#################################


# Redis访问密码


#################################
# 持久化配置
#################################


# 开启AOF持久化
# 每次写操作追加日志
appendonly yes

# AOF文件名称
appendfilename "appendonly.aof"

# 同步策略
# everysec:
# 每秒同步一次
# 性能和安全平衡（最多丢 1 秒的数据）
appendfsync everysec

# AOF/RDB 的落盘目录
# ⚠️ 必须显式写 /data：compose 里把 ./redis/data 挂到了容器的 /data，
#    只有指到这里，数据才会落在宿主机上、容器重建也不丢
#    （官方镜像的 WORKDIR 恰好是 /data，所以不写也能用，但换个镜像/基础镜像就落进容器里了）
dir /data

# RDB 快照：AOF 之外留一份，用于备份、以及 AOF 损坏时的兜底
save 900 1
save 300 10


#################################
# 内存管理
#################################


# 最大内存（按机器内存调：这个实例里同时住着【购物车 + 登录会话 + 商品缓存】）
maxmemory 2048mb

# 内存不足淘汰策略
# ⚠️ 绝对不能用 allkeys-lru：内存一满它会【静默删掉任何 key】——
#    包括用户购物车和登录会话，表现就是"购物车莫名清空、莫名其妙要重新登录"。
# noeviction：宁可写失败报错（日志/接口里看得见），也绝不偷偷删数据。
# 更正规的做法是拆实例：购物车+会话一个 noeviction 实例，纯缓存另一个用 allkeys-lru
maxmemory-policy noeviction


#################################
# 日志配置
#################################


# 日志级别
loglevel notice


#################################
# 数据库数量
#################################


# 默认16个库
databases 16

